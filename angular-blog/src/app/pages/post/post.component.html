<main class="pagina-post" *ngIf="post">

  <!-- Imagem hero -->
  <div class="post-hero">
    <img [src]="post.imagem" [alt]="post.imagemAlt" class="post-hero-imagem">
    <div class="post-hero-overlay"></div>
    <div class="post-hero-conteudo container">
      <div class="post-categoria-wrap">
        <span class="tag">{{ post.categoria }}</span>
      </div>
      <h1 class="post-hero-titulo">{{ post.titulo }}</h1>
      <p class="post-hero-subtitulo">{{ post.subtitulo }}</p>
      <div class="post-hero-meta">
        <span class="post-meta-autor">Por <strong>{{ post.autor }}</strong></span>
        <span class="post-meta-sep">·</span>
        <span class="post-meta-data">{{ formatarData(post.dataPublicacao) }}</span>
        <span class="post-meta-sep">·</span>
        <span class="post-meta-tempo">{{ post.tempoLeitura }} min de leitura</span>
      </div>
    </div>
  </div>

  <!-- Corpo do artigo -->
  <div class="container post-layout">
    <aside class="post-sidebar">
      <button class="btn-voltar" (click)="voltar()">← Voltar</button>

      <div class="sidebar-compartilhar">
        <p class="sidebar-label">Compartilhar</p>
        <div class="sidebar-btns">
          <button class="sidebar-btn" title="Twitter/X">𝕏</button>
          <button class="sidebar-btn" title="WhatsApp">W</button>
          <button class="sidebar-btn" title="LinkedIn">in</button>
          <button class="sidebar-btn" title="Copiar link">🔗</button>
        </div>
      </div>

      <div class="sidebar-tags">
        <p class="sidebar-label">Tags</p>
        <div class="tags-lista">
          <span class="tag" *ngFor="let tag of post.tags">{{ tag }}</span>
        </div>
      </div>
    </aside>

    <article class="post-artigo">
      <div class="post-conteudo" [innerHTML]="post.conteudo"></div>

      <div class="post-autor-box">
        <div class="autor-avatar">{{ post.autor.charAt(0) }}</div>
        <div class="autor-info">
          <p class="autor-nome-label">Sobre o autor</p>
          <h4 class="autor-nome-grande">{{ post.autor }}</h4>
          <p class="autor-bio">{{ post.autorBio }}</p>
        </div>
      </div>
    </article>
  </div>

  <!-- Posts relacionados -->
  <section class="secao-relacionados" *ngIf="postsRelacionados.length > 0">
    <div class="container">
      <app-menu-title titulo="Leia também" subtitulo="Artigos relacionados"></app-menu-title>
      <div class="relacionados-grid">
        <app-small-card *ngFor="let p of postsRelacionados" [post]="p"></app-small-card>
      </div>
    </div>
  </section>

</main>
